// Synchronisation légère des scores sans recharger la page ni déplacer le scroll.
let liveRefreshing=false;
async function refreshLive(){
 if(liveRefreshing||document.hidden||!['d','m','n','f','l'].includes(view))return;
 liveRefreshing=true;
 try{
  const response=await fetch('data.js?live='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const source=await response.text();
  const match=source.match(/const M=(\[[\s\S]*?\]);/);
  if(!match)throw new Error('Données live illisibles');
  const latest=JSON.parse(match[1]);
  let liveMembershipChanged=false;
  for(const fresh of latest){
   const current=M.find(x=>String(x.id)===String(fresh.id));if(!current)continue;
   const wasLive=['IN_PLAY','PAUSED','SUSPENDED'].includes(current.liveStatus)&&liveFresh(current);
   ['liveStatus','liveScore','liveMinute','liveAdded','liveUpdatedAt','liveSource','r'].forEach(key=>{
    if(JSON.stringify(current[key]??null)!==JSON.stringify(fresh[key]??null)){
     if(fresh[key]===undefined)delete current[key];else current[key]=fresh[key];
    }
   });
   const isLive=['IN_PLAY','PAUSED','SUSPENDED'].includes(effectiveLiveStatus(current))&&liveFresh(current);
   if(wasLive!==isLive)liveMembershipChanged=true;
  }
  if(view==='l'&&liveMembershipChanged)render();
  document.querySelectorAll('[data-match-id]').forEach(card=>{
   const m=M.find(x=>String(x.id)===card.dataset.matchId);if(!m)return;
   let line=card.querySelector('.live-status');
   if(!m.liveStatus||!liveFresh(m)){if(line)line.remove();return}
   if(!line){line=liveNode(m);const teams=card.querySelector('.teams');if(teams)teams.insertAdjacentElement('afterend',line);else card.prepend(line)}
   const st=effectiveLiveStatus(m);
   line.className='live-status '+(st==='PAUSED'?'paused':st==='FINISHED'?'finished':st==='IN_PLAY'?'':'other');
   line.textContent=liveText(m);
  });
 }catch(error){console.warn('Actualisation live impossible :',error)}
 finally{liveRefreshing=false}
}
