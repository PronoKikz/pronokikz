<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prono Foot IA</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b0d10"><link rel="icon" href="icon-512.png">
<script>document.write('<script src="data.js?t='+Date.now()+'"><\/script>')</script>
<style>
:root{--bg:#0b0d10;--card:#161a20;--bd:#272e38;--tx:#f4f6f9;--mu:#8b95a3;--gold:#f5b800;--g:#2ecc71;--r:#ff5a5f;--bl:#4f7cff;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,-apple-system,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:24px;margin:2px 0 4px}h1 span{color:var(--gold)}
.mu{color:var(--mu);font-size:13px}
.rf{width:100%;padding:12px;border:0;border-radius:14px;background:var(--gold);color:#111;font-size:16px;font-weight:800;margin:10px 0}
h2{font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin:10px 0}
.tip{border:2px solid var(--gold);background:linear-gradient(160deg,#2a2208,var(--card))}
.safe{border:2px solid var(--g)}.fun{border:2px solid var(--bl)}.c2{border:2px solid var(--gold)}
.ttl{font-weight:800;font-size:15px;margin-bottom:6px}
.l{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:7px 0;border-top:1px solid var(--bd)}.l span:last-child{font-weight:800;color:var(--gold);white-space:nowrap}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:13px;color:var(--mu)}.tot b{font-size:24px;color:var(--tx)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.chips{display:flex;gap:6px}.chip{font-size:12px;font-weight:800;padding:4px 9px;border-radius:8px;background:#232a33;color:var(--mu)}
.chip.g{background:#12301f;color:var(--g)}.chip.y{background:#33290a;color:var(--gold)}.chip.r{background:#3a1518;color:var(--r)}
.teams{display:grid;grid-template-columns:1fr 100px 1fr;align-items:center;gap:6px;text-align:center;font-weight:700;font-size:17px;margin-bottom:12px}
.ring{width:96px;height:96px;border-radius:50%;margin:0 auto;background:conic-gradient(var(--gold) calc(var(--p)*1%),var(--bl) 0);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.ring::before{content:'';position:absolute;inset:6px;border-radius:50%;background:var(--card)}.ring>*{position:relative}
.ring b{font-size:24px;line-height:1}.pr{font-size:11px;font-weight:800;color:var(--gold);margin-top:5px;background:#33290a;padding:2px 8px;border-radius:7px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:1px solid var(--bd);border-radius:12px;padding:8px 2px;text-align:center;background:#10141a}.btn small{display:block;color:var(--mu);font-size:12px;font-weight:700}.btn b{font-size:20px}
.btn.on{border-color:var(--gold);background:#2a2208}.btn.on b,.btn.on small{color:var(--gold)}
.gg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tag{border:1px solid var(--bd);border-radius:12px;padding:8px;text-align:center;font-weight:800;font-size:14px;color:var(--mu);background:#10141a}.tag.on{border-color:var(--g);color:var(--g);background:#0f2418}
.fin{margin-top:10px;padding:8px;border-radius:12px;background:#10141a;text-align:center;font-size:14px;font-weight:700}
.ia{margin:10px 0 0;font-size:13px;color:var(--mu)}
</style></head><body><main>
<h1>⚽ Pronos <span>du jour</span></h1>
<p class="mu" id="d"></p>
<button class="rf" onclick="location.reload()">🔄 Actualiser</button>
<div id="app"></div>
<p class="mu">Estimations indicatives, sans garantie de gain. Jouer comporte des risques : endettement, isolement… Réservé aux +18 ans. Aide : 09 74 75 13 13.</p>
</main>
<script>
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
const A=document.getElementById('app');
if(!M.length){A.textContent='Aucun match aujourd’hui dans les championnats suivis.';throw new Error('no matches')}
const h=(t,c,x,...k)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;k.forEach(n=>n&&e.appendChild(n));return e};
const pc=x=>Math.round(x*100)+'%',cote=x=>(1/x).toFixed(2).replace('.',','),nm=m=>m.home+' – '+m.away;
const pick=m=>[['1',m.p1],['N',m.pN],['2',m.p2]].sort((a,b)=>b[1]-a[1])[0];
function chk(m){if(!m.r)return null;const [a,b]=m.r,real=a>b?'1':a==b?'N':'2';return{s:a+' : '+b,r:pick(m)[0]==real,b:(m.btts>=.5)==(a>0&&b>0)}}
function bilan(){let w=0,l=0;M.forEach(m=>{const c=chk(m);if(c)[c.r,c.b].forEach(x=>x?w++:l++)});return w+l?'Bilan : '+w+' gagnés / '+l+' perdus':'Bilan : aucun match terminé'}
function isOpen(m){if(m.r)return false;const [H,I]=m.h.split(':'),n=new Date();return n.getHours()*60+n.getMinutes()<+H*60+ +I}
const OPEN=M.filter(isOpen);
function legSafe(m){const o=pick(m);
 if(o[1]>=.6)return{m:nm(m),l:o[0]=='1'?m.home+' gagne':o[0]=='2'?m.away+' gagne':'Match nul',p:o[1]};
 const d=[['pas de nul',m.p1+m.p2],[m.home+' ou nul',m.p1+m.pN],[m.away+' ou nul',m.pN+m.p2]].sort((a,b)=>b[1]-a[1])[0];return{m:nm(m),l:d[0],p:d[1]}}
function legFun(m){const c=[[m.home+' gagne',m.p1],['Match nul',m.pN],[m.away+' gagne',m.p2],['Les 2 marquent',m.btts],['Pas les 2 qui marquent',1-m.btts]].sort((a,b)=>b[1]-a[1])[0];return{m:nm(m),l:c[0],p:c[1]}}
function box(cls,ti,legs,note){const p=legs.reduce((a,x)=>a*x.p,1),e=h('div','card '+cls,null,h('div','ttl',ti));
 legs.forEach(x=>e.appendChild(h('div','l',null,h('span',null,x.m+' : '+x.l),h('span',null,pc(x.p)))));
 e.appendChild(h('div','tot',null,h('span',null,'Cote équitable ~'+cote(p)),h('b',null,pc(p))));if(note)e.appendChild(h('p','ia',note));A.appendChild(e)}
function target(mx,ti,cls){const L=OPEN.map(legFun),n=L.length;let b=null;
 for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){let p=L[i].p*L[j].p;if(p<=mx&&(!b||p>b.p))b={l:[L[i],L[j]],p};
  for(let k=j+1;k<n;k++){p=L[i].p*L[j].p*L[k].p;if(p<=mx&&(!b||p>b.p))b={l:[L[i],L[j],L[k]],p}}}
 if(!b){A.appendChild(h('div','card '+cls,null,h('div','ttl',ti),h('p','ia','Pas assez de matchs à venir pour ce combiné aujourd’hui.')));return}
 box(cls,ti,b.l,'À jouer seulement si la cote du bookmaker est au moins de '+(1/mx).toFixed(2).replace('.',',')+'.')}
function card(m){const [k,pk]=pick(m),c=chk(m),sc=(m.ia||'').match(/(\d)-(\d)/),cf=pk>=.6?['Élevée','g']:pk>=.45?['Moyenne','y']:['Faible',''];
 const ring=h('div','ring',null,h('b',null,sc?sc[1]+' : '+sc[2]:'–'),h('span','pr','PRONO '+k));ring.style.cssText='--p:'+Math.round(pk*100);
 const B=(l,p,on)=>h('div','btn'+(on?' on':''),null,h('small',null,l),h('b',null,pc(p)));
 const e=h('div','card',null,
  h('div','top',null,h('span','mu',m.lg+' · '+m.h),h('span','chips',null,h('span','chip '+cf[1],cf[0]),c&&h('span','chip '+(c.r?'g':'r'),c.r?'✓ GAGNÉ':'✗ PERDU'))),
  h('div','teams',null,h('div',null,m.home),ring,h('div',null,m.away)),
  h('div','row3',null,B('1',m.p1,k=='1'),B('N',m.pN,k=='N'),B('2',m.p2,k=='2')),
  h('div','gg',null,h('div','tag'+(m.btts>=.5?' on':''),'GG OUI '+pc(m.btts)),h('div','tag'+(m.btts<.5?' on':''),'GG NON '+pc(1-m.btts))));
 e.appendChild(c?h('div','fin','Score final '+c.s+'  ·  1N2 '+(c.r?'✅':'❌')+'  ·  GG '+(c.b?'✅':'❌')):h('p','ia','🤖 '+(m.ia||'')));return e}
document.getElementById('d').textContent=DATE+' · '+bilan()+(typeof UPDATED!=='undefined'?' · données de '+new Date(UPDATED).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'');
const best=OPEN.map(m=>({m,o:pick(m)})).sort((a,b)=>b.o[1]-a.o[1])[0];
if(best)A.appendChild(h('div','card tip',null,h('div','mu','CONSEIL DU JOUR'),h('div','ttl',nm(best.m)+' : '+(best.o[0]=='1'?best.m.home+' gagne':best.o[0]=='2'?best.m.away+' gagne':'match nul')),h('div','mu','Confiance '+pc(best.o[1])+' · '+best.m.h)));
const sl=OPEN.map(legSafe).sort((a,b)=>b.p-a.p).slice(0,2);
if(sl.length>1)box('safe','Combiné safe',sl);
target(.5,'Mon conseil cote 2+','c2');target(.2,'Combiné fun (cote 5+)','fun');
A.appendChild(h('h2',null,'Tous les matchs'));
M.forEach(m=>A.appendChild(card(m)));
</script></body></html>
