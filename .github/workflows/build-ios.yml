name: Build Pronokikz for iOS

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    # EAS compiles iOS in Expo's cloud; this avoids waiting for a GitHub macOS runner.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Build signed iOS IPA with EAS
        working-directory: mobile
        run: eas build --platform ios --profile production --non-interactive --wait --json > ../eas-ios-build.json

      - name: Download generated IPA
        working-directory: mobile
        run: |
          BUILD_ID="$(node -e "const b=require('../eas-ios-build.json'); const x=Array.isArray(b)?b[0]:b; if(!x.id) process.exit(1); process.stdout.write(x.id)")"
          eas build:download --build-id "$BUILD_ID" --non-interactive --json > ./eas-ios-download.json
          IPA_PATH="$(node -e "const d=require('./eas-ios-download.json'); if(!d.path) process.exit(1); process.stdout.write(d.path)")"
          test -f "$IPA_PATH"
          cp "$IPA_PATH" ../Pronokikz.ipa
          test -s ../Pronokikz.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pronokikz-iOS-IPA
          path: Pronokikz.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish IPA release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: Pronokikz iPhone - build ${{ github.run_number }}
          body: |
            Fichier IPA Pronokikz compilé pour iOS.

            L'installation directe dépend de la signature Apple et du profil de provisionnement associé.
          files: Pronokikz.ipa
          make_latest: false
