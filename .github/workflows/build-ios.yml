name: Build unsigned Pronokikz IPA for AltStore

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    # A macOS runner is required to compile a real iPhone device app.
    # Signing is intentionally disabled; AltStore signs the IPA on the user's device.
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm ci

      - name: Generate iOS native project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods dependencies
        working-directory: mobile
        run: pod install --project-directory=ios

      - name: Build iOS app without Apple signing
        working-directory: mobile
        run: |
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          test -n "$WORKSPACE"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme Pronokikz \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build
          APP_PATH="$(find build/ios/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p ../ipa/Payload
          cp -R "$APP_PATH" ../ipa/Payload/
          cd ../ipa
          /usr/bin/zip -qry ../Pronokikz-unsigned.ipa Payload
          test -s ../Pronokikz-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pronokikz-unsigned-IPA
          path: Pronokikz-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish unsigned IPA release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-unsigned-${{ github.run_number }}
          name: Pronokikz iPhone (unsigned) - build ${{ github.run_number }}
          body: |
            IPA iOS non signée. À importer dans AltStore ou SideStore pour la signer avec un identifiant Apple gratuit.
            La signature gratuite expire généralement après 7 jours.
          files: Pronokikz-unsigned.ipa
          make_latest: false
