name: Mise à jour des pronos
on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 12-22/2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node update.js
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      - name: Enregistrer les changements
        run: |
          git config user.name "prono-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.js data.json
          git diff --cached --quiet || (git commit -m "Mise à jour $(date -u +%F-%H%M)" && git push)
