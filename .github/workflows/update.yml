name: Mise à jour des pronos
on:
  push:
    branches:
      - main
    paths:
      - 'update.js'
      - 'predictor.js'
      - 'expert.js'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 12-22/2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node update.js
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY || secrets.FOOTBALL_DATA_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY || secrets.FOOTBALL_DATA_API_KEY }}
      - name: Enregistrer les changements
        run: |
          git config user.name "prono-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.js data.json
          git diff --cached --quiet || (git commit -m "Mise à jour $(date -u +%F-%H%M)" && git push)
