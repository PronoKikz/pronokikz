name: Publish Pronokikz app updates

on:
  push:
    branches:
      - main
    paths:
      - "mobile/App.tsx"
      - "mobile/**/*.tsx"
      - "mobile/**/*.ts"
      - "mobile/**/*.js"
      - "mobile/assets/**"

permissions:
  contents: read

jobs:
  publish-update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish update to installed Pronokikz apps
        run: eas update --channel preview --message "GitHub update ${GITHUB_SHA}" --environment preview --non-interactive
