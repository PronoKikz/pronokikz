name: Actualisation des scores en direct
concurrency:
  group: pronokikz-data-update
  cancel-in-progress: false
on:
  push:
    branches:
      - main
    paths:
      - 'live.js'
      - '.github/workflows/live-scores.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node live.js
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY || secrets.FOOTBALL_DATA_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY || secrets.FOOTBALL_DATA_API_KEY }}
          LEAGUES: ${{ vars.LEAGUES }}
      - name: Enregistrer les scores live
        run: |
          git config user.name "prono-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Actualisation scores live $(date -u +%F-%H%M)" && git push)
